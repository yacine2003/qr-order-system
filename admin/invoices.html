<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Factures</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fots -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-gray-50 font-sans">

    <!-- Navbar -->
    <nav class="bg-white shadow-sm border-b sticky top-0 z-30">
        <div class="container mx-auto px-4 py-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <a href="/admin" class="text-xl font-bold text-gray-800 hover:text-indigo-600 transition-colors">
                        🍽️ Admin
                    </a>
                    <div class="h-6 w-px bg-gray-200"></div>
                    <span class="font-semibold text-gray-600">📑 Gestion des Factures</span>
                </div>
                <div>
                    <a href="/admin/dashboard.html"
                        class="flex items-center gap-2 px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">
                        <span>← Retour au Dashboard</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">

        <!-- Header & Filters -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Factures</h1>
                <p class="text-gray-500 mt-1">Historique des commandes et justificatifs</p>
            </div>

            <div class="flex items-center gap-3">
                <div class="relative">
                    <input type="date" id="dateFilter"
                        class="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <button onclick="loadInvoices()"
                    class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition-colors shadow-sm">
                    Actualiser
                </button>
            </div>
        </div>

        <!-- Stats Card -->
        <div class="bg-white rounded-xl shadow-sm p-6 mb-8 border border-gray-100">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-gray-500 mb-1">Total Ventes (Jour) TTC</p>
                    <h2 class="text-3xl font-bold text-gray-800" id="totalSales">0.00 €</h2>
                </div>
                <div class="text-right">
                    <p class="text-sm font-medium text-gray-500 mb-1">Nombre de Factures</p>
                    <h2 class="text-3xl font-bold text-gray-800" id="invoicesCount">0</h2>
                </div>
            </div>
        </div>

        <!-- Invoices Table -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-50 border-b">
                        <tr>
                            <th class="px-6 py-4 font-semibold text-gray-600 text-sm">Heure</th>
                            <th class="px-6 py-4 font-semibold text-gray-600 text-sm">N° Commande</th>
                            <th class="px-6 py-4 font-semibold text-gray-600 text-sm">Table</th>
                            <th class="px-6 py-4 font-semibold text-gray-600 text-sm text-right">Montant TTC</th>
                            <th class="px-6 py-4 font-semibold text-gray-600 text-sm text-center">Articles</th>
                            <th class="px-6 py-4 font-semibold text-gray-600 text-sm text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="invoicesList" class="divide-y divide-gray-100">
                        <!-- Rempli dynamiquement -->
                        <tr>
                            <td colspan="6" class="px-6 py-8 text-center text-gray-400">
                                Chargement...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script src="invoices.js"></script>
</body>

</html>
